name: Deploy CN Showcase to Tencent COS

on:
  workflow_dispatch:
  push:
    branches:
      - showcase

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TENCENT_CLOUD_SECRET_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TENCENT_CLOUD_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.COS_REGION }}
      COS_BUCKET: ${{ secrets.COS_BUCKET }}
      COS_REGION: ${{ secrets.COS_REGION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build upload package
        run: npm run prepare:cos:cn

      - name: Install AWS CLI
        run: python -m pip install awscli

      - name: Upload to COS
        run: |
          ENDPOINT="https://cos.${COS_REGION}.myqcloud.com"
          aws --endpoint-url "$ENDPOINT" s3 sync deploy/cos-cn/ "s3://${COS_BUCKET}/" --delete
          aws --endpoint-url "$ENDPOINT" s3 cp deploy/cos-cn/index.html "s3://${COS_BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache" \
            --metadata-directive REPLACE
